<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোবাইল ভাগ্য বার্তা</title>
    <link rel="stylesheet" href="mobile-fortune.css">
</head>
<body>
    <main class="mobile-shell">
        <header class="top-logos" aria-label="Logos">
            <img src="assets/mobile/Logo.png" alt="Logo" class="logo-left">
            <img src="assets/mobile/Boishakhi logo.png" alt="Boishakhi Logo" class="logo-right">
        </header>

        <section class="fortune-section" aria-live="polite">
            <p class="fortune-label">আজকের ভাগ্যবার্তা</p>
            <div class="fortune-card">
                <p id="fortuneText">ভাগ্য বার্তা লোড হচ্ছে...</p>
            </div>
            <p id="audioHint" class="audio-hint" hidden>ভয়েস শোনার জন্য স্ক্রিনে একবার ট্যাপ করুন</p>
        </section>
    </main>

    <img src="assets/mobile/Tepa.png" alt="Tepa" class="tepa-footer">
    <audio id="mobile-tts-player" style="display: none;"></audio>

    <script src="messages.js"></script>
    <script src="mobile-fortune.js"></script>
</body>
</html>
